# vim:ft=conf
# Kitty Configuration File
# Matched to ghostty config

# Theme
include Catppuccin-Mocha.conf
background_blur 20

# Window
hide_window_decorations titlebar-only
window_padding_width 0
window_margin_width 0
draw_minimal_borders yes
background_opacity 1
modify_font cell_height 110%
confirm_os_window_close 0

# Shell integration
shell_integration no-cursor

# Fonts
font_family      "Monaspace Neon Regular"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0
disable_ligatures never

# Cursor
cursor #FFA500
cursor_text_color #1E1E2E
cursor_shape block
cursor_blink_interval 0

# Mouse
mouse_hide_wait 1.0
copy_on_select yes
strip_trailing_spaces smart

###########################################################
# Symbols Nerd Font complete symbol_map
###########################################################

# "Nerd Fonts - Pomicons"
symbol_map  U+E000-U+E00D Symbols Nerd Font

# "Nerd Fonts - Powerline"
symbol_map U+e0a0-U+e0a2,U+e0b0-U+e0b3 Symbols Nerd Font

# "Nerd Fonts - Powerline Extra"
symbol_map U+e0a3-U+e0a3,U+e0b4-U+e0c8,U+e0cc-U+e0d2,U+e0d4-U+e0d4 Symbols Nerd Font

# "Nerd Fonts - Symbols original"
symbol_map U+e5fa-U+e62b Symbols Nerd Font

# "Nerd Fonts - Devicons"
symbol_map U+e700-U+e7c5 Symbols Nerd Font

# "Nerd Fonts - Font awesome"
symbol_map U+f000-U+f2e0 Symbols Nerd Font

# "Nerd Fonts - Font awesome extension"
symbol_map U+e200-U+e2a9 Symbols Nerd Font

# "Nerd Fonts - Octicons"
symbol_map U+f400-U+f4a8,U+2665-U+2665,U+26A1-U+26A1,U+f27c-U+f27c Symbols Nerd Font

# "Nerd Fonts - Font Linux"
symbol_map U+F300-U+F313 Symbols Nerd Font

#  Nerd Fonts - Font Power Symbols"
symbol_map U+23fb-U+23fe,U+2b58-U+2b58 Symbols Nerd Font

#  "Nerd Fonts - Material Design Icons"
symbol_map U+f500-U+fd46 Symbols Nerd Font

# "Nerd Fonts - Weather Icons"
symbol_map U+e300-U+e3eb Symbols Nerd Font

# Misc Code Point Fixes
symbol_map U+21B5,U+25B8,U+2605,U+2630,U+2632,U+2714,U+E0A3,U+E615,U+E62B Symbols Nerd Font

###########################################################
# Keybindings (ctrl+a prefix, matching tmux)
###########################################################

# Remote control for tab switcher
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

enabled_layouts splits,stack

# Pass through ctrl+a (tmux send-prefix)
map ctrl+a>a send_text all \x01

# --- Splits (tmux: prefix + % / ") ---
map ctrl+a>shift+5 launch --location=vsplit --cwd=current
map ctrl+a>shift+' launch --location=hsplit --cwd=current
map ctrl+a>equal launch --location=vsplit --cwd=current
map ctrl+a>minus launch --location=hsplit --cwd=current

# --- Navigate splits (no prefix, like vim-tmux-navigator) ---
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# Navigate splits (with prefix, like tmux hjkl)
map ctrl+a>h neighboring_window left
map ctrl+a>j neighboring_window down
map ctrl+a>k neighboring_window up
map ctrl+a>l neighboring_window right

# --- Resize splits (tmux: prefix + H/J/K/L) ---
map ctrl+a>shift+h resize_window narrower 3
map ctrl+a>shift+j resize_window shorter 3
map ctrl+a>shift+k resize_window taller 3
map ctrl+a>shift+l resize_window wider 3

# --- Tabs (tmux "windows") ---
map ctrl+a>c new_tab_with_cwd
map ctrl+a>shift+n new_tab_with_cwd
map ctrl+a>ctrl+h previous_tab
map ctrl+a>ctrl+l next_tab
map ctrl+a>comma set_tab_title
map ctrl+a>period move_tab_forward

# Jump to tab (tmux: prefix + 1-9)
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# --- Tab switcher (tmux: prefix + s for session switching) ---
map ctrl+a>s launch --type=overlay sh -c 'kitty @ ls | python3 -c "import sys,json;data=json.load(sys.stdin);[print(f\"{t[\\\"id\\\"]}\t{t[\\\"title\\\"]}\") for w in data for t in w.get(\\\"tabs\\\",[]) if not t.get(\\\"is_focused\\\")]" | fzf --reverse --header="jump-to-tab" | cut -f1 | xargs -I{} kitty @ focus-tab --match id:{}'

# --- Toggle zoom (tmux: prefix + z) ---
map ctrl+a>z toggle_layout stack

# --- Lazygit popup (tmux: prefix + g) ---
map ctrl+a>g launch --type=overlay --cwd=current lazygit

# --- Yazi in new tab (tmux: prefix + y) ---
map ctrl+a>y launch --type=tab --cwd=current yazi

# --- Tiled layout (tmux: prefix + =) ---
map ctrl+a>shift+equal goto_layout splits

# --- Close split (tmux: prefix + x) ---
map ctrl+a>x close_window

# --- Scrollback / copy mode (tmux: prefix + Escape) ---
map ctrl+a>escape show_scrollback

# --- Reload config (tmux: prefix + r) ---
map ctrl+a>r load_config_file

# Override kitty-overrides.conf for local customizations
include kitty-overrides.conf
