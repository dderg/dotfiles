services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    hostname: hindsight
    pull_policy: always
    network_mode: host
    dns:
      - 192.168.1.1
    extra_hosts:
      - "freellmapi.home:192.168.1.59"
    env_file:
      - hindsight.env
      - ${HOME}/.config/hindsight/secrets.env
    volumes:
      - hindsight-data:/home/hindsight/.pg0
      - ${HOME}/.codex:/var/lib/hindsight/codex
      # Overlay: adds per-member circuit breaker (cooldown) to LLM failover routing.
      # Based on image v0.8.5 file; re-diff against upstream after image updates.
      - ./patches/multi_llm.py:/app/api/hindsight_api/engine/multi_llm.py:ro
      # Overlay: compacts gaps in HINDSIGHT_API_*LLM_<n>_* indices so disabling
      # a member doesn't silently drop the ones after it.
      - ./patches/sitecustomize.py:/app/api/.venv/lib/python3.11/site-packages/sitecustomize.py:ro
    restart: unless-stopped
    environment:
      CODEX_HOME: /var/lib/hindsight/codex
      # Idle OpenMP workers spin-wait by default, burning full-power cycles while
      # doing no work. PASSIVE parks them on a futex instead.
      #
      # Deliberately NOT capping OMP_NUM_THREADS. Measured on this M5 Pro (6 "Super"
      # cores = cpu12-17, 12 "Performance" = cpu0-11): capping to 6 threads kept 94%
      # of rerank work on the high-power Super cores (68.9 Super core-s per 8
      # recalls). Leaving torch at one thread per vCPU lets the scheduler spill onto
      # the efficient cores -- 34.7 Super core-s, 40% share, at identical wall time.
      OMP_WAIT_POLICY: "passive"
volumes:
  hindsight-data:
    external: true
